<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>せかいの国旗クイズ 🌍</title>
<style>
  :root{
    --bg1:#6a11cb; --bg2:#2575fc; --accent:#ffd93d; --ok:#2ecc71; --ng:#ff5e6c;
    --card:rgba(255,255,255,.16); --cardline:rgba(255,255,255,.35);
    --ink:#fff; --ink-soft:rgba(255,255,255,.82);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic UI",-apple-system,"Segoe UI",sans-serif;
    color:var(--ink);
    background:linear-gradient(135deg,var(--bg1),var(--bg2));
    background-attachment:fixed;
    min-height:100%;
    display:flex;align-items:center;justify-content:center;
    padding:20px;overflow-x:hidden;
  }
  /* floating deco */
  .bubble{position:fixed;border-radius:50%;background:rgba(255,255,255,.08);pointer-events:none;z-index:0}
  .b1{width:220px;height:220px;top:-60px;left:-60px}
  .b2{width:160px;height:160px;bottom:-40px;right:-30px}
  .b3{width:90px;height:90px;top:20%;right:8%}
  .wrap{width:100%;max-width:560px;position:relative;z-index:1}
  .panel{
    background:var(--card);
    border:1.5px solid var(--cardline);
    border-radius:28px;
    padding:28px 24px 30px;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 20px 50px rgba(0,0,0,.28);
    animation:pop .45s cubic-bezier(.2,1.2,.4,1) both;
  }
  @keyframes pop{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:none}}
  .hide{display:none!important}

  h1{font-size:30px;text-align:center;line-height:1.25;text-shadow:0 3px 0 rgba(0,0,0,.15)}
  h1 .globe{display:inline-block;animation:spin 6s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .subtitle{text-align:center;color:var(--ink-soft);margin-top:8px;font-size:15px}
  .section-label{font-size:15px;color:var(--ink-soft);margin:22px 0 10px;font-weight:700}
  .section-label:first-of-type{margin-top:24px}

  .opts{display:grid;gap:12px}
  .choice{
    display:flex;align-items:center;gap:14px;
    border:none;cursor:pointer;text-align:left;width:100%;
    background:rgba(255,255,255,.9);color:#333;
    border-radius:18px;padding:16px 18px;font-size:18px;font-weight:700;
    transition:transform .12s, box-shadow .12s, background .2s;
    box-shadow:0 6px 0 rgba(0,0,0,.12);
  }
  .choice:hover{transform:translateY(-2px)}
  .choice:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.12)}
  .choice .emo{font-size:26px;flex:0 0 auto}
  .choice.sel{background:var(--accent);color:#5a4500}
  .choice small{display:block;font-weight:600;color:#666;font-size:12px;margin-top:2px}
  .choice.sel small{color:#7a6200}

  .big-btn{
    display:block;width:100%;margin-top:26px;cursor:pointer;border:none;
    background:var(--accent);color:#5a4500;font-weight:900;font-size:22px;
    border-radius:20px;padding:18px;box-shadow:0 7px 0 #d9a900;
    transition:transform .12s, box-shadow .12s, opacity .2s;
  }
  .big-btn:hover{transform:translateY(-2px)}
  .big-btn:active{transform:translateY(3px);box-shadow:0 3px 0 #d9a900}
  .big-btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:0 7px 0 #d9a900;transform:none}

  /* HUD */
  .hud{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}
  .stat{background:rgba(0,0,0,.18);border-radius:14px;padding:8px 12px;text-align:center;min-width:74px;flex:1}
  .stat .n{font-size:22px;font-weight:900;line-height:1}
  .stat .l{font-size:11px;color:var(--ink-soft);margin-top:3px}
  .stat .n.flame{color:var(--accent)}
  .progress{height:10px;background:rgba(0,0,0,.2);border-radius:10px;overflow:hidden;margin-bottom:20px}
  .progress > i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd93d,#ff9a3d);border-radius:10px;transition:width .4s}

  /* question */
  .qlabel{text-align:center;color:var(--ink-soft);font-size:15px;margin-bottom:14px;font-weight:700}
  .flagbox{
    display:flex;justify-content:center;align-items:center;margin:0 auto 22px;
    background:#fff;border-radius:18px;padding:14px;width:min(280px,80%);
    box-shadow:0 12px 26px rgba(0,0,0,.25);animation:pop .4s both;
  }
  .flagbox img{width:100%;height:auto;display:block;border-radius:8px}
  .qname{text-align:center;margin:2px 0 22px}
  .qname .ja{font-size:34px;font-weight:900;line-height:1.2;text-shadow:0 3px 0 rgba(0,0,0,.15)}
  .qname .fuki{font-size:16px;color:var(--ink-soft);margin-top:6px}

  /* flag choices grid */
  .flag-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .flag-choice{
    cursor:pointer;border:3px solid transparent;background:#fff;border-radius:16px;padding:8px;
    box-shadow:0 6px 0 rgba(0,0,0,.12);transition:transform .12s,box-shadow .12s;
  }
  .flag-choice img{width:100%;height:auto;border-radius:7px;display:block;aspect-ratio:3/2;object-fit:cover}
  .flag-choice:hover{transform:translateY(-2px)}
  .flag-choice:active{transform:translateY(2px)}

  .choice.correct,.flag-choice.correct{background:var(--ok)!important;border-color:#fff;color:#fff;animation:cheer .5s}
  .choice.wrong,.flag-choice.wrong{background:var(--ng)!important;border-color:#fff;color:#fff;animation:shake .4s}
  .choice:disabled,.flag-choice:disabled{cursor:default}
  @keyframes cheer{0%,100%{transform:scale(1)}40%{transform:scale(1.06)}}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

  .feedback{text-align:center;min-height:32px;margin-top:16px;font-size:20px;font-weight:900}
  .feedback.ok{color:var(--accent)}
  .feedback.ng{color:#ffd0d5}
  .next-btn{margin-top:14px}

  /* toast emoji */
  .toast{position:fixed;top:34%;left:50%;transform:translate(-50%,-50%);font-size:90px;z-index:5;pointer-events:none;opacity:0}
  .toast.show{animation:toast .9s ease-out}
  @keyframes toast{0%{opacity:0;transform:translate(-50%,-30%) scale(.4)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}

  /* result */
  .result-emo{font-size:80px;text-align:center;animation:pop .5s both}
  .result-score{text-align:center;font-size:52px;font-weight:900;margin:6px 0;text-shadow:0 3px 0 rgba(0,0,0,.15)}
  .result-sub{text-align:center;color:var(--ink-soft);font-size:17px}
  .result-line{display:flex;justify-content:space-around;margin:22px 0 4px}
  .result-line .stat{background:rgba(0,0,0,.18)}

  .mute-btn{position:fixed;top:14px;right:16px;z-index:6;background:rgba(0,0,0,.25);border:none;color:#fff;
    font-size:20px;width:44px;height:44px;border-radius:50%;cursor:pointer}
  @media(max-width:420px){h1{font-size:25px}.qname .ja{font-size:28px}.result-score{font-size:44px}}
</style>
</head>
<body>
<div class="bubble b1"></div><div class="bubble b2"></div><div class="bubble b3"></div>
<button class="mute-btn" id="muteBtn" title="音のオン・オフ">🔊</button>
<div class="toast" id="toast">🎉</div>

<div class="wrap">
  <!-- ===== START ===== -->
  <section class="panel" id="startScreen">
    <h1><span class="globe">🌍</span><br>せかいの国旗クイズ</h1>
    <p class="subtitle">あそびかたをえらんでね</p>

    <div class="section-label">クイズのタイプ</div>
    <div class="opts" id="modeOpts">
      <button class="choice" data-mode="flag2name">
        <span class="emo">🚩</span>
        <span>国旗 → 国名<small>はたを見て、国の名前をあてる</small></span>
      </button>
      <button class="choice" data-mode="name2flag">
        <span class="emo">🔤</span>
        <span>国名 → 国旗<small>名前を見て、正しいはたをえらぶ</small></span>
      </button>
      <button class="choice" data-mode="mix">
        <span class="emo">🎲</span>
        <span>ミックス<small>2つのタイプがランダムに出るよ</small></span>
      </button>
    </div>

    <div class="section-label">レベル（むずかしさ）</div>
    <div class="opts" id="levelOpts">
      <button class="choice" data-level="1">
        <span class="emo">🐣</span>
        <span>やさしい<small>だれでも知っている 30の国</small></span>
      </button>
      <button class="choice" data-level="2">
        <span class="emo">🦉</span>
        <span>ふつう<small>世界の主要な 80の国</small></span>
      </button>
      <button class="choice" data-level="3">
        <span class="emo">🦅</span>
        <span>むずかしい<small>世界ぜんぶ 197の国</small></span>
      </button>
    </div>

    <button class="big-btn" id="startBtn" disabled>スタート！</button>
  </section>

  <!-- ===== QUIZ ===== -->
  <section class="panel hide" id="quizScreen">
    <div class="hud">
      <div class="stat"><div class="n" id="hudScore">0</div><div class="l">スコア</div></div>
      <div class="stat"><div class="n flame" id="hudStreak">0</div><div class="l">🔥 れんぞく</div></div>
      <div class="stat"><div class="n" id="hudQ">1/10</div><div class="l">もんだい</div></div>
    </div>
    <div class="progress"><i id="progBar"></i></div>

    <div class="qlabel" id="qLabel"></div>
    <div id="qArea"></div>
    <div class="opts" id="answerArea"></div>

    <div class="feedback" id="feedback"></div>
    <button class="big-btn next-btn hide" id="nextBtn">つぎのもんだい →</button>
  </section>

  <!-- ===== RESULT ===== -->
  <section class="panel hide" id="resultScreen">
    <div class="result-emo" id="resEmo">🏆</div>
    <div class="result-score"><span id="resScore">0</span> てん</div>
    <p class="result-sub" id="resMsg"></p>
    <div class="result-line">
      <div class="stat"><div class="n" id="resCorrect">0</div><div class="l">せいかい</div></div>
      <div class="stat"><div class="n flame" id="resBest">0</div><div class="l">🔥 さいこう連続</div></div>
      <div class="stat"><div class="n" id="resRate">0%</div><div class="l">せいかい率</div></div>
    </div>
    <button class="big-btn" id="againBtn">もういちど！</button>
    <button class="big-btn" id="homeBtn" style="background:rgba(255,255,255,.9);color:#444;box-shadow:0 7px 0 rgba(0,0,0,.15);margin-top:12px">さいしょの画面へ</button>
  </section>
</div>

<script>

const flagUrl=(c,big)=>FLAGS[c]||"";

// ---- state ----
let mode, level, pool, quiz, idx, score, streak, bestStreak, correctCount, locked;

// ---- helpers ----
const $=id=>document.getElementById(id);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const sample=(arr,n)=>shuffle(arr).slice(0,n);

// ---- sound (WebAudio, no files) ----
let audioCtx=null, muted=false;
function beep(freqs,dur){
  if(muted)return;
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    let t=audioCtx.currentTime;
    freqs.forEach((f,i)=>{
      const o=audioCtx.createOscillator(),g=audioCtx.createGain();
      o.type='triangle';o.frequency.value=f;
      o.connect(g);g.connect(audioCtx.destination);
      const st=t+i*dur;
      g.gain.setValueAtTime(0.0001,st);
      g.gain.exponentialRampToValueAtTime(0.25,st+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,st+dur);
      o.start(st);o.stop(st+dur);
    });
  }catch(e){}
}
const sndCorrect=()=>beep([523,659,784],0.12);
const sndWrong=()=>beep([311,233],0.16);
const sndClick=()=>beep([440],0.05);
const sndFinish=()=>beep([523,659,784,1047],0.15);

// ---- start screen selection ----
$('modeOpts').addEventListener('click',e=>{
  const b=e.target.closest('.choice'); if(!b)return;
  [...$('modeOpts').children].forEach(c=>c.classList.remove('sel'));
  b.classList.add('sel'); mode=b.dataset.mode; sndClick(); checkReady();
});
$('levelOpts').addEventListener('click',e=>{
  const b=e.target.closest('.choice'); if(!b)return;
  [...$('levelOpts').children].forEach(c=>c.classList.remove('sel'));
  b.classList.add('sel'); level=+b.dataset.level; sndClick(); checkReady();
});
function checkReady(){ $('startBtn').disabled=!(mode&&level); }

$('muteBtn').onclick=()=>{muted=!muted;$('muteBtn').textContent=muted?'🔇':'🔊';};
$('startBtn').onclick=startGame;
$('nextBtn').onclick=()=>{idx++; idx>=TOTAL?endGame():renderQuestion();};
$('againBtn').onclick=startGame;
$('homeBtn').onclick=()=>{show('startScreen');};

function show(id){['startScreen','quizScreen','resultScreen'].forEach(s=>$(s).classList.toggle('hide',s!==id));window.scrollTo(0,0);}

function startGame(){
  pool=COUNTRIES.filter(c=>c.level<=level);
  const picks=sample(pool,TOTAL);
  quiz=picks.map(ans=>{
    const wrongs=sample(pool.filter(c=>c.code!==ans.code),CHOICES-1);
    const options=shuffle([ans,...wrongs]);
    const qmode = mode==='mix' ? (Math.random()<0.5?'flag2name':'name2flag') : mode;
    return {ans,options,qmode};
  });
  idx=0;score=0;streak=0;bestStreak=0;correctCount=0;
  show('quizScreen');renderQuestion();
}

function renderQuestion(){
  locked=false;
  const q=quiz[idx];
  $('hudScore').textContent=score;
  $('hudStreak').textContent=streak;
  $('hudQ').textContent=(idx+1)+'/'+TOTAL;
  $('progBar').style.width=(idx/TOTAL*100)+'%';
  $('feedback').textContent='';$('feedback').className='feedback';
  $('nextBtn').classList.add('hide');
  const qArea=$('qArea'), aArea=$('answerArea');
  qArea.innerHTML='';aArea.innerHTML='';aArea.className='opts';

  if(q.qmode==='flag2name'){
    $('qLabel').textContent='この国旗はどこの国かな？';
    qArea.innerHTML=`<div class="flagbox"><img alt="国旗" src="${flagUrl(q.ans.code,true)}"></div>`;
    q.options.forEach(o=>{
      const b=document.createElement('button');
      b.className='choice';b.dataset.code=o.code;
      b.innerHTML=`<span>${o.ja}<small>${o.fuki}</small></span>`;
      b.onclick=()=>answer(b,o,q);
      aArea.appendChild(b);
    });
  }else{
    $('qLabel').textContent='この国の国旗はどれかな？';
    qArea.innerHTML=`<div class="qname"><div class="ja">${q.ans.ja}</div><div class="fuki">${q.ans.fuki}</div></div>`;
    aArea.className='flag-grid';
    q.options.forEach(o=>{
      const b=document.createElement('button');
      b.className='flag-choice';b.dataset.code=o.code;
      b.innerHTML=`<img alt="こっき" src="${flagUrl(o.code,false)}">`;
      b.onclick=()=>answer(b,o,q);
      aArea.appendChild(b);
    });
  }
}

function answer(btn,opt,q){
  if(locked)return; locked=true;
  const correct=opt.code===q.ans.code;
  const all=[...$('answerArea').children];
  all.forEach(b=>b.disabled=true);
  if(correct){
    btn.classList.add('correct');
    score+=10; streak++; correctCount++;
    if(streak>bestStreak)bestStreak=streak;
    if(streak>=3)score+=streak; // streak bonus
    let msg='せいかい！ 🎉';
    if(streak>=5)msg=`すごい！ ${streak}れんぞく正解！🔥`;
    else if(streak>=3)msg=`いいね！ ${streak}れんぞく！✨`;
    $('feedback').textContent=msg;$('feedback').className='feedback ok';
    popToast(streak>=3?'🔥':'🎉');
    sndCorrect();
  }else{
    btn.classList.add('wrong');
    all.find(b=>b.dataset.code===q.ans.code)?.classList.add('correct');
    streak=0;
    $('feedback').textContent='ざんねん… 正解は「'+q.ans.ja+'」';
    $('feedback').className='feedback ng';
    popToast('😢');
    sndWrong();
  }
  $('hudScore').textContent=score;
  $('hudStreak').textContent=streak;
  $('progBar').style.width=((idx+1)/TOTAL*100)+'%';
  $('nextBtn').classList.remove('hide');
  $('nextBtn').textContent = idx>=TOTAL-1 ? 'けっかを見る 🏁' : 'つぎのもんだい →';
}

function popToast(e){const t=$('toast');t.textContent=e;t.classList.remove('show');void t.offsetWidth;t.classList.add('show');}

function endGame(){
  sndFinish();
  const rate=Math.round(correctCount/TOTAL*100);
  $('resScore').textContent=score;
  $('resCorrect').textContent=correctCount+'/'+TOTAL;
  $('resBest').textContent=bestStreak;
  $('resRate').textContent=rate+'%';
  let emo,msg;
  if(rate===100){emo='🏆';msg='パーフェクト！ 国旗はかせだね！';}
  else if(rate>=80){emo='🌟';msg='すばらしい！ とてもよくできました！';}
  else if(rate>=50){emo='😄';msg='いいちょうし！ もういちどチャレンジ！';}
  else{emo='🌱';msg='これからだよ！ たくさんおぼえよう！';}
  $('resEmo').textContent=emo;$('resMsg').textContent=msg;
  show('resultScreen');
}
</script>
</body>
</html>
